# Test kontraktu + obraz ghcr.io/4dmin-pl/admindesk-konsola (amd64/arm64); tag v* -> wydanie z install.sh
name: AdminDesk Konsola

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  konsola:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Test kontraktu z klientem
        run: python3 test_konsola.py
      - name: Składnia install.sh
        run: bash -n install.sh && shellcheck -S warning install.sh
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/4dmin-pl/admindesk-konsola:1
            ghcr.io/4dmin-pl/admindesk-konsola:latest
      - name: Wydanie (tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: install.sh
